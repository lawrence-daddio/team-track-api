spring.application.name=TeamTrack

#JWT (dev-only secret: base64-encoded 256-bit key; override via SECURITY_JWT_SECRET_KEY env var)
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:mkawYCBflntJ6LpTsoFwuEo2PTo7FSrv6JrsUI9SMB0=}
#token lifetime in milliseconds (1 hour)
security.jwt.expiration-time=3600000

#H2 Configurations
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.sql.init.data-locations=classpath:team_track.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
